name: Rural Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rural-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Start local server (background)
      run: |
        npx serve . -l 8080 & 
        SERVER_PID=$!
        echo "SERVER_PID=${SERVER_PID}" >> $GITHUB_ENV
        sleep 5

    - name: Run Rural Audit
      run: node _scripts/pwa_rural_audit.cjs http://localhost:8080
      env:
        CI: true

    - name: Check Accessibility Score
      run: |
        REPORT_FILE=$(ls _auditories/rural-audit-*.json | tail -n 1)
        ACCESSIBILITY_SCORE=$(node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('$REPORT_FILE', 'utf8'));
          console.log(report.summary.accessibility || 0);
        ")
        echo "Accessibility Score: $ACCESSIBILITY_SCORE"
        if (( $(echo "$ACCESSIBILITY_SCORE < 0.90" | bc -l) )); then
          echo "❌ Accessibility below 90% threshold!"
          exit 1
        else
          echo "✅ Accessibility meets 90% threshold."
        fi

    - name: Cleanup
      if: always()
      run: pkill -f "serve" || true
