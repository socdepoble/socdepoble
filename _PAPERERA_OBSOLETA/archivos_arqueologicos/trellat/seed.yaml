# 🌾 Trellat Universal Seed — Editable por comunidades
# Validar con: npx ajv validate -s trellat.schema.json -d seed.yaml

meta:
  version: trellat-universal-v1.0
  locale: ca-ES
  author: "Mestre Javi Llinares + Comunitat La Torre de les Maçanes"
  license: CC-BY-SA-4.0
  integrity:
    sha384: "generado automáticamente al firmar"
    signedBy: "socdepoble.org/pgp-key"

architecture:
  offlineFirst: true
  connectivityProfile: rural-3G
  compression:
    minBatchSizeKB: 4
    maxBatchSizeKB: 64
    algorithm: deflate
    useWorker: true
  syncProtocol: [websocket, broadcastchannel, indexeddb] # Fallback chain
  hardwareConstraints:
    minRAM_MB: 1024
    maxAssetSizeKB: 300
    disableAnimations: false

cultural:
  oralTraditionWeight: 0.7
  governanceModel: hybrid # elder-council + consensus
  communityHierarchy:
    roles:
      - id: "mestre"
        weight: 0.4
        permissions: ["edit-cms", "validate-reputation", "mediate-conflicts"]
      - id: "veí-antic"
        weight: 0.3
        permissions: ["validate-content", "propose-rituals"]
      - id: "jove"
        weight: 0.2
        permissions: ["create-content", "share-media"]
      - id: "visitant"
        weight: 0.1
        permissions: ["read-only"]
    reputationDecay: exponential
  mediaPreferences:
    preferAudio: true
    preferImage: true
    preferVideo: false
    maxAssetSizeKB: 300
    shareRituals: ["festes-majors", "recol·lecta", "vetlles", "transmissió-familiar"]
  ritualContexts:
    - id: "vetlla-narrativa"
      name: "Vetlla de contes al foc"
      uiAdaptations:
        colorPalette: ["#1a1a2e", "#16213e", "#f97316"] # Nocturn + accent Trellat
        typography: serif
        iconography: "flame,book,elder"
        animationStyle: subtle
    - id: "festes-majors"
      name: "Festes de la Torre"
      uiAdaptations:
        colorPalette: ["#f97316", "#0984E3", "#ffffff"]
        typography: sans
        iconography: "music,dance,community"
        animationStyle: ceremonial

linguistic:
  locale: ca-ES
  oralStyleMarkers:
    fillerWords: ["eh?", "saps?", "mira", "doncs"]
    pauseMarkers: ["...", "—", "•"]
    emphasisPatterns: ["*emphasis*", "**strong**", "¡atenció!"]
    narrativeStructures: ["començar-per-el-final", "circular", "amb-moral"]
  glossary:
    "trellat":
      term: "Trellat"
      definition: "Seny, austeritat tecnològica i fer més amb menys"
      culturalContext: "Filosofia fundacional de Sóc de Poble"
      avoidInTranslation: false
      adaptAs: "common-sense-tech-austerity"
    "mas":
      term: "Mas"
      definition: "Unitat familiar i productiva rural tradicional"
      culturalContext: "Estructura social base"
      avoidInTranslation: true
  translationModels:
    provider: supabase-edge
    modelSizeMB: 45
    fallbackLanguage: ca-ES
    culturalMediationRules:
      - trigger: "expressió-valenciana-única"
        action: explain
        reason: "Preservar identitat lingüística local"
        targetContexts: ["external-visitors", "translation-output"]

ai:
  skills:
    summarization:
      enabled: true
      preserveOralStyle: true
      maxLength: 280
    culturalMediation:
      enabled: true
      transparencyLevel: full

sovereignty:
  dataOwnership: community
  encryption: local-only
  auditability: community-audited
  exportPolicy:
    allowFullExport: true
    format: [json, epub, markdown, audio]

rejected:
  - cloud-only-sync
  - engagement-optimized-algorithms
  - centralized-identity-providers
  - real-time-typing-indicators
  - infinite-scroll-without-pause
  - auto-play-media
  - dark-patterns-for-retention
  - third-party-analytics-without-consent
  - ai-generated-content-without-attribution
  - biometric-identity-verification
  - "any-technology-that-increases-data-consumption-without-user-consent"

adaptation:
  componentOverrides:
    NavigationRail: "src/components/adapted/ValencianNav.tsx"
    Footer: "src/components/adapted/RuralFooter.tsx"
  cssVariables:
    --sdp-orange: "#f97316"
    --sdp-blue: "#0984E3"
    --font-serif: "Noto Serif", "Libre Baskerville", serif
  serviceWorkerPlugins:
    - "rural-cache-strategy"
    - "audio-first-preloading"
