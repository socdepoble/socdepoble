# Configuración Coturn - Sóc de Poble
listening-port=3478
realm=turn.socdepoble.org
# Restringir puertos UDP para no asfixiar los descriptores de red del VPS
min-port=49152
max-port=65535
# Autenticación estricta para evitar parásitos de ancho de banda
use-auth-secret
static-auth-secret=EL_TEU_SECRET_RURAL_GENERATE_ACI
# LÍMITE VITAL: 500kbps por sesión (solo transferimos deltas CRDT de texto/binario, cero video)
bps-capacity=500000  
total-quota=200
# Apagamos encriptación redundante cliente-servidor para no ahogar la CPU
no-tls
no-dtls
no-cli
no-stdout-log
