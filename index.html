<!doctype html>

<head>
  <meta charset="UTF-8" />
  <!-- Cache Prevention -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="icon" type="image/png" href="/favicon.png?v=Genius_154" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=Genius_154" />
  <link rel="manifest" href="/manifest.json?v=Genius_154" />

  <!-- Performance Optimized (Direct Load) -->

  <script>
    // ATOMIC VERSION ENFORCEMENT (v1.5.5-NUCLEAR)
    (function () {
      const REQUIRED_VERSION = '1.5.5-NUCLEAR';
      const lastNuke = localStorage.getItem('last_nuclear_nuke');

      if (lastNuke !== REQUIRED_VERSION) {
        console.warn('[NUCLEAR] Version mismatch or first run of v1.5.5. PURGING EVERYTHING...');
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem('last_nuclear_nuke', REQUIRED_VERSION);

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let r of regs) r.unregister();
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    })();

    // SELF-HEALING PROTOCOL
    window.onerror = function (message, source, lineno, colno, error) {
      if (message.includes('ReferenceError') || message.includes('RescueTool')) {
        console.error('[NUCLEAR] ReferenceError detected! Forcing hard reset...');
        localStorage.clear();
        sessionStorage.clear();
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let r of regs) r.unregister();
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    };

    window.CREATOR_EMAILS = window.CREATOR_EMAILS || ['socdepoblecom@gmail.com', 'damimus@gmail.com'];
    window.APP_VERSION = '1.5.5-NUCLEAR-CIMERA';
  </script>

  <title>Sóc de Poble | Cimera de la Simbiosi 🧠🌍</title>
  <meta name="description"

  <meta name="author" content="Sóc de Poble" />

  <!-- Open Graph / WhatsApp Agressiu Cache Busting -->
  <meta property="og:type" content="website" />

  <meta property="og:title" content="Sóc de Poble v1.5.5-NUCLEAR 🏘️☢️" />

  <meta property="og:image:alt" content="Sóc de Poble - Portal de Pobles Connectats" />
  <meta property="og:site_name" content="Sóc de Poble" />
  <meta property="og:locale" content="ca_ES" />

  <script>
    // GLOBAL SAFETY NET: Minimal fallback if the main JS bundle fails.
    // We use a plain HTML string injection to avoid dependency on React if it fails to load.
    window.RescueToolFallback = function () {
      document.body.innerHTML = `
        <div style="padding: 40px; text-align: center; background: #0f172a; color: #fff; height: 100vh; font-family: sans-serif;">
          <h1 style="color: #ff0055;">🚨 Error Crític de Sistema</h1>
          <p>S'ha detectat una fallada en el bategat de l'aplicació.</p>
          <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload(true);" 
            style="padding: 15px 30px; background: #00f2ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
            Netejar Cache i Reiniciar Protocol
          </button>
          <div style="margin-top: 20px; opacity: 0.5; font-size: 12px;">v1.5.5-NUCLEAR-CIMERA</div>
        </div>
      `;
    };

    // If the JS bundle works, this will be overwritten by a real React component.
    window.RescueTool = window.RescueTool || window.RescueToolFallback;
  </script>

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

<body>
  <div id="root">
    <!-- CRITICAL FALLBACK UI: Visible only if React fails to mount -->
    <div id="loader-fallback"
      style="font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#0f172a;padding:20px;text-align:center;color:white;">
      <img src="/favicon.png?v=Genius_154" alt="Logo"
        style="width:80px;height:80px;margin-bottom:20px;border-radius:20px;box-shadow:0 0 30px rgba(0,242,255,0.4)" />

      <div id="fallback-status">
        <h2
          style="margin-bottom:10px; color: #00f2ff; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem;">
          Iniciant Bategat...
        </h2>
        <div
          style="width: 40px; height: 40px; border: 3px solid rgba(0,242,255,0.2); border-top-color: #00f2ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto;">
        </div>
      </div>

      <div id="repair-zone" style="display:none; margin-top: 20px;">
        <p style="color: #ff0055; font-weight: bold; margin-bottom: 15px;">⚠️ S'ha detectat un retard en l'arrancada.
        </p>
        <button
          onclick="localStorage.clear(); sessionStorage.clear(); if('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs => { for(let r of rs) r.unregister(); location.reload(true); }); } else { location.reload(true); }"
          style="background:#ff0055; color:white; padding:15px 30px; border-radius:12px; border:none; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(255,0,85,0.3);">
          FORÇAR REPARACIÓ NUCLEAR
        </button>
      </div>

      <script>
        // Show repair button after 5 seconds if #root is still showing this fallback
        setTimeout(() => {
          const repairZone = document.getElementById('repair-zone');
          if (repairZone) repairZone.style.display = 'block';
        }, 5000);
      </script>

      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
  </div>
  <div class="app-version"
    style="position:fixed;bottom:10px;right:10px;font-size:10px;opacity:0.3;pointer-events:none;">v1.5.5-NUCLEAR
