    <!-- 🚨 EMERGENCY PWA KILL-SWITCH - SOC DE POBLE - 2026-04-07 (QWEN AUDITED) -->
    <script>
      (function () {
        "use strict";
        // GEM MODERN: Determini i Sobirania. Pujem la versió per executar en sec.
        var FORCE_UPDATE_VERSION = "v-emergency-8-trellat";

        function log(m) {
          // Colors oficials: Taronja i Blau Sóc de Poble aplicats a la consola per mantenir identitat
          // console.log("%c[🚨 SÓC DE POBLE (KILL-SWITCH)]%c " + m, "color: #FF6600; font-weight: bold;", "color: #0056B3; font-weight: bold;");
        }

        // 🛡️ EINA DEL TRELLAT: Cortafocs asíncron (Promise.race)
        function withTimeout(promise, ms, name) {
          return Promise.race([
            promise,
            new Promise(function(resolve) {
              setTimeout(function() {
                log("⏳ Temps exhaurit a " + name + ". El Zombi reté la I/O. Forçant l'avanç...");
                resolve(); 
              }, ms);
            })
          ]);
        }

        function clearAllCaches() {
          var promises = [];

          if ('caches' in window) {
            promises.push(
              withTimeout(
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) {
                    log("Eliminant memòria cau: " + k);
                    return caches.delete(k)["catch"](function(){}); 
                  }));
                })["catch"](function(e) { log("Error API Cache: " + e); }),
                1500,
                "Cache Storage"
              )
            );
          }

          if ('indexedDB' in window) {
            promises.push(
              withTimeout(
                new Promise(function(resolve) {
                  var dbs = ["idb-keyval", "socdepoble-db", "poble-db"];
                  var pending = dbs.length;
                  if (pending === 0) return resolve();

                  dbs.forEach(function(name) {
                    try {
                      var req = indexedDB.deleteDatabase(name);
                      var done = false; 
                      var advance = function() {
                        if (done) return;
                        done = true;
                        if (--pending === 0) resolve();
                      };
                      req.onsuccess = function() { advance(); };
                      req.onerror = function() { advance(); };
                      req.onblocked = function() { log("IDB retingut pel Zombi: " + name); advance(); };
                    } catch (e) {
                      log("Excepció IDB " + name + ": " + e);
                      advance();
                    }
                  });
                }),
                1500,
                "IndexedDB"
              )
            );
          }

          promises.push(
            new Promise(function(resolve) {
              try {
                localStorage.clear();
                sessionStorage.clear();
                log("Emmagatzematge síncron netejat.");
              } catch (e) {}
              resolve(); 
            })
          );

          return Promise.all(promises);
        }

        function unregisterAllSWs() {
          if (!('serviceWorker' in navigator)) return Promise.resolve();
          return withTimeout(
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              if (!regs || regs.length === 0) return Promise.resolve();
              log("Desregistrant " + regs.length + " SWs...");
              
              // [KIMI]: KILL_YOURSELF (añadido al código de Gemini)
              try {
                 if (navigator.serviceWorker.controller) {
                   navigator.serviceWorker.controller.postMessage({ type: 'KILL_YOURSELF' });
                 }
              } catch(e) {}
              
              return Promise.all(regs.map(function(reg) {
                try {
                  if (reg.active) reg.active.postMessage({ type: 'KILL_YOURSELF' });
                  if (reg.waiting) reg.waiting.postMessage({ type: 'KILL_YOURSELF' });
                } catch(e) {}
                return reg.unregister()["catch"](function(){});
              }));
            })["catch"](function(e) { log("Error desregistrant SW: " + e); }),
            1500,
            "Service Workers"
          );
        }

        function hardReload() {
          log("🔁 Ecosistema purgat. Bategant cap a la nova inmensa arquitectura...");
          window.location.replace(
            window.location.href.split("?")[0] + "?sw-killed=true&trellat=" + new Date().getTime()
          );
        }

        function checkAndKill() {
          var stored;
          try { stored = localStorage.getItem("pwa-version"); } catch(e){}
          
          if (stored === FORCE_UPDATE_VERSION) {
            log("Versió prístina detectada. El Trellat preval.");
            return;
          }

          log("Iniciant extracció atòmica i purga del Zombi...");

          var reloaded = false;
          var finishAndReload = function() {
            if (reloaded) return;
            reloaded = true;
            try { localStorage.setItem("pwa-version", FORCE_UPDATE_VERSION); } catch(e){}
            setTimeout(hardReload, 200);
          };

          var failsafe = setTimeout(function() {
            if (!reloaded) {
              log("⚠️ Failsafe Global: Zombi enquistat. Intervenció directa.");
              finishAndReload();
            }
          }, 3500);

          unregisterAllSWs()
            .then(clearAllCaches)
            .then(function() { log("Purga completada."); })
            ["catch"](function(err) { log("Error absorbit: " + err); })
            .then(function() {
              clearTimeout(failsafe);
              finishAndReload();
            });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", checkAndKill);
        } else {
          checkAndKill();
        }
      })();
    </script>

            if (e.target.tagName === "LINK" || e.target.tagName === "SCRIPT") {

          },
          true,

    <!-- [PWA GHOST LOCK] Pre-Boot Failsafe -->
    <script>
      (async function() {
        const APP_CODE_VERSION = 15;
        function getIDBVersion() {
          return new Promise((resolve) => {
            try {
              const req = indexedDB.open('rhizome-v1');
              req.onupgradeneeded = (e) => {
                // If it doesn't exist, we don't have a newer version
                e.target.transaction.abort();
                resolve(0);
              };
              req.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('keyval')) {
                  resolve(0);
                  return;
                }
                const tx = db.transaction('keyval', 'readonly');
                const store = tx.objectStore('keyval');
                const getReq = store.get('_sdp_schema_version');
                getReq.onsuccess = () => resolve(getReq.result || 0);
                getReq.onerror = () => resolve(0);
              };
              req.onerror = () => resolve(0);
            } catch { resolve(0); }
          });
        }
        
        try {
          const idbVersion = await getIDBVersion();
          if (idbVersion > APP_CODE_VERSION) {
            // ⚠️ PWA GHOST DETECTADO. Cortafuegos activado.
            document.body.innerHTML = `
              <div style="background: var(--blau-socdepoble, #06b6d4); color: var(--taronja-socdepoble, #ea580c); font-size: 28px; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; line-height: 1.4; font-family: 'Noto Sans', sans-serif;">
                El Mas Digital s'ha reformat.<br><span style="font-size: 22px; color: white;">Netejant la memòria...</span>
              </div>`;
            
            // Purga atómica: Obligamos al SW a matarse
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              regs.forEach(reg => {
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              });
            }
            
            // Recarga implacable saltándose la caché tras 1.5s
            setTimeout(() => window.location.reload(true), 1500);
            throw new Error("[TRELLAT] Boot abortat per prevenir corrupció d'UI fantasma.");
          }
        } catch (e) {
          if (e.message.includes("[TRELLAT]")) throw e;
        }
      })();
    </script>
