    <!-- [PWA GHOST LOCK] Pre-Boot Failsafe OPTIMITZAT (Timeout Strict) -->
    <script>
      (function() {
        const APP_CODE_VERSION = 15;
        const TIMEOUT_MS = 400; // Protecció contra Lighthouse/WebKit Hanging Promises

        function getIDBVersion() {
          return new Promise((resolve) => {
            try {
              const req = window.indexedDB.open('rhizome-v1');
              req.onupgradeneeded = (e) => {
                e.target.transaction.abort();
                resolve({ status: 'OK', version: 0 });
              };
              req.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('keyval')) {
                  db.close();
                  resolve({ status: 'OK', version: 0 });
                  return;
                }
                const tx = db.transaction('keyval', 'readonly');
                const store = tx.objectStore('keyval');
                const getReq = store.get('_sdp_schema_version');
                getReq.onsuccess = () => {
                  db.close();
                  resolve({ status: 'OK', version: getReq.result || 0 });
                };
                getReq.onerror = () => {
                  db.close();
                  resolve({ status: 'OK', version: 0 });
                };
              };
              req.onerror = () => resolve({ status: 'ERROR', reason: 'OPEN_FAILED' });
              req.onblocked = () => resolve({ status: 'BLOCKED', reason: 'DB_LOCKED' });
            } catch (err) {
              resolve({ status: 'EXCEPTION', reason: err.message });
            }
          });
        }
        
        const timeoutPromise = new Promise(resolve => 
          setTimeout(() => resolve({ status: 'TIMEOUT', reason: 'IDB_HUNG' }), TIMEOUT_MS)
        );

        window.__PRE_BOOT_STATE__ = Promise.race([getIDBVersion(), timeoutPromise]);

        // Lògica de neteja asíncrona (NO bloqueja el FCP)
        window.__PRE_BOOT_STATE__.then(async (result) => {
          if (result.status === 'OK' && result.version !== 0 && result.version !== APP_CODE_VERSION) {
            console.warn("[TRELLAT] Corrupció detectada. Netejant...");
            window.__SDP_BOOT_ABORT = true;
            document.getElementById('app-shell-fallback').innerHTML = `<div style="color: #ea580c; font-size: 20px; font-weight: bold;">Netejant memòria...</div>`;
            
            // Purga COMPLETA
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map(k => caches.delete(k)));
            }
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(r => r.unregister()));
            }
            
            localStorage.removeItem('sp_app_version');
            localStorage.removeItem('sp_last_version_reload');
            
            try {
              window.indexedDB.deleteDatabase('rhizome-v1');
            } catch(e) {}
            
            setTimeout(() => {
              const url = new URL(window.location.href);
              url.searchParams.set('_ghost', Date.now().toString(36));
              window.location.href = url.toString();
            }, 500);
          } else if (result.status === 'TIMEOUT' || result.status === 'ERROR' || result.status === 'BLOCKED') {
            console.warn('[Pre-Boot] IDB compromès o penjat a Lighthouse/Safari Private.', result);
          }
        });
      })();
    </script>
