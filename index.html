<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="light dark" />
  <title>Sóc de Poble</title>
  
  <style>
    /* VARIABLES GLOBALS - TOKENS CANÒNICS IAIA */
    :root {
      --sp-black-900: #000000;
      --sp-orange-500: #FF7300;
      --sp-blue-600: #0984E3;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { height: 100%; background: #f3f4f6; }
    
    @media (min-width: 768px) {
      html, body { background: #1a1a1a; }
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* La reducció d'animacions de low-end-device s'ha mogut a index.css per centralitzar-la */

    #root { height: 100%; }

    #sp-shell-sk {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #f3f4f6;
      transition: opacity 350ms ease-out;
      display: flex;
      flex-direction: column;
    }

    .sk-header {
      height: 56px;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      background: #000000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .sk-sidebar {
      display: none;
    }

    .sk-bottomnav {
      margin-top: auto;
      height: 64px;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: #050505;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    @media (min-width: 768px) {
      .sk-bottomnav { display: none; }
      #sp-shell-sk { flex-direction: row; background: #1a1a1a; }
      .sk-sidebar {
        display: block;
        width: 240px;
        background: #050505;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        height: 100%;
        flex-shrink: 0;
      }
      .sk-header { display: none; }
    }
    @media (min-width: 1024px) {
      .sk-sidebar { width: 280px; }
    }

    /* NAVEGADOR INDICA HIDRATACIÓ FINALITZADA */
    html[data-hydrated="1"] #sp-shell-sk {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #sp-shell-sk { transition: none !important; }
    }

    /* CLASSES PER ESQUELET (SENSE INLINE STYLES) */
    .sk-sidebar-inner { padding: 24px; }
    .sk-logo-ph { height: 42px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 40px; }
    .sk-item-ph { height: 24px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 16px; }
    .sk-main-col { flex: 1; display: flex; flex-direction: column; }
    .sk-main-spacer { flex: 1; }

    /* CLASSES PER FALLBACK FATAL (SENSE INLINE STYLES) */
    .fatal-fallback-container {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #050505; color: #fff; font-family: sans-serif; z-index: 9999; padding: 20px; text-align: center;
    }
    .fatal-icon { font-size: 40px; margin-bottom: 20px; }
    .fatal-title { margin-bottom: 10px; }
    .fatal-desc { color: #aaa; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- SKELETON INITIAL PAINT -->
  <div id="sp-shell-sk" aria-hidden="true">
    <div class="sk-sidebar sk-sidebar-inner">
      <div class="sk-logo-ph"></div>
      <div class="sk-item-ph"></div>
      <div class="sk-item-ph"></div>
      <div class="sk-item-ph"></div>
      <div class="sk-item-ph"></div>
    </div>
    <div class="sk-main-col">
      <div class="sk-header"></div>
      <div class="sk-main-spacer"></div>
      <div class="sk-bottomnav"></div>
    </div>
  </div>

  <script>
    var sk = document.getElementById('sp-shell-sk');
    if (sk) {
      sk.addEventListener('transitionend', function(e) { 
        if (e.propertyName === 'opacity') this.remove(); 
      }, { once: true });
    }
    
    setTimeout(function() {
      if (!document.documentElement.dataset.hydrated) {
        if (sk && sk.parentNode) sk.remove();
        if (!document.getElementById('fatal-fallback')) {
          var fallback = document.createElement('div');
          fallback.id = 'fatal-fallback';
          fallback.className = 'fatal-fallback-container';
          fallback.innerHTML = '<div class="fatal-icon">⚠️</div><h2 class="fatal-title">Sóc de Poble no respon.</h2><p class="fatal-desc">El dispositiu no ha pogut carregar el sistema.</p>';
          document.body.appendChild(fallback);
          console.warn('Antigravity Failsafe: Skeleton suprimit i fallback fatal injectat.');
        }
      }
    }, 5000);
  </script>

  <script type="module" src="/src/app/entry.jsx"></script>
</body>
</html>
