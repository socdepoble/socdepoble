      // Silence library warnings for a pristine Golden Master console.
      const _warn = console.warn;
      console.warn = function (...args) {
        if (
          typeof args[0] === "string" &&
          (args[0].includes("tailwind") ||
            args[0].includes("Babel") ||
            args[0].includes("production"))

              </div>

                className={`fixed inset-0 z-[1000] lg:static lg:flex-1 w-full bg-black ${
                  selectedChat || activeTab === "PROFILE"
                    ? "flex animate-in"
                    : "hidden lg:flex"
                }`}
              >
                {forenseMode && activeTab === "XAT" && (
                  <BlueprintOverlay
                    label="MAIN_VIEW"
                    info={activeTab}
                    color="magenta"
                    onOpenDoc={setDocModal}
                  />
                )}
                {activeTab === "PROFILE" ? (
                  <ProfileView
                    user={MOCK_USER_PROFILE}
                    onClose={() => setActiveTab("XAT")}
                    isDark={isDark}
                    textMain={textMain}
                    textMuted={textMuted}
                    borderCol={borderCol}
                  />
                ) : !selectedChat ? (
                  showWelcomeAd && activeTab === "XAT" ? (
                    <div className="flex-1 flex flex-col items-center justify-center p-8 text-center relative zoom-in">
                      <button
                        onClick={() => setShowWelcomeAd(false)}
                        className="absolute top-6 right-6 p-4 rounded-full bg-black/80 hover:bg-slate-900 border border-slate-700 text-white transition-all z-[10004] shadow-2xl cursor-pointer active:scale-95"
                      >
                        <Icon name="X" size={28} />
                      </button>
                      <div className="max-w-md">
                        <div className="w-32 h-32 mx-auto mb-8 rounded-[40px] flex items-center justify-center border-4 border-slate-800 bg-black shadow-xl">
                          <div className="border-2 border-white text-white px-3 py-1 font-bold text-3xl">
                            SP
                          </div>
                        </div>
                        <h1
                          className={`text-5xl font-bold mb-6 tracking-tight ${textMain}`}
                        >
                          Sóc de Poble
                        </h1>
                        <p className={`text-lg leading-relaxed ${textMuted}`}>
                          El cor del poble, ara connectat. Benvingut a casa,
                          v12.6.1.
                        </p>
                      </div>
                    </div>
                  ) : (
                    <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500">
                      <Icon
                        name="MessageSquare"
                        size={48}
                        className="mb-4 opacity-20"
                      />
                      <p>Selecciona un xat per començar</p>
                    </div>
                  )
                ) : (
                  <div
                    className={`flex-1 flex flex-col ${bgApp} animate-in slide-in-from-right relative h-full`}
                  >
                    <header
                      className={`h-16 flex items-center px-4 border-b ${borderCol} sticky top-0 z-30 ${
                        isDark ? "bg-black/50" : "bg-white/50"
                      } backdrop-blur-md`}
                    >
                      <button
                        onClick={() => setSelectedChat(null)}
                        className="mr-3 p-2 rounded-full hover:bg-white/10 text-slate-400 group transition-colors"
                      >
                        <Icon
                          name="ChevronLeft"
                          className="group-hover:-translate-x-1 transition-transform"
                        />
                      </button>
                      <div className="flex items-center gap-3">
                        <div
                          className={`w-10 h-10 rounded-full ${
                            isDark ? "bg-slate-800" : "bg-slate-200"
                          } flex items-center justify-center text-xl shadow-inner`}
                        >
                          {selectedChat?.avatar}
                        </div>
                        <div>
                          <h3
                            className={`font-bold text-sm tracking-tight ${textMain}`}
                          >
                            {selectedChat?.name}
                          </h3>
                          <p className="text-[10px] text-green-500 font-bold uppercase tracking-[0.2em]">
                            En línia
                          </p>
                        </div>
                      </div>
                      <div className="ml-auto flex items-center gap-1">
                        <button className="p-3 text-slate-400 hover:text-indigo-500 transition-colors">
                          <Icon name="Users2" size={20} />
                        </button>
                        <button
                          onClick={() => setSelectedChat(null)}
                          className="p-3 rounded-full hover:bg-white/10 text-slate-400 active:scale-95 transition-all"
                        >
                          <Icon name="X" size={24} />
                        </button>
                      </div>
                    </header>

                    <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6 flex flex-col justify-end">
                      <div className="flex flex-col items-center justify-center mb-auto py-12 opacity-40">
                        <div className="w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center text-emerald-500 mb-4 border border-emerald-500/20 shadow-inner">
                          <Icon name="Lock" size={28} />
                        </div>
                        <p
                          className={`text-[10px] tracking-[0.4em] font-mono uppercase ${textMuted}`}
                        >
                          Xat Engabiat i Protegit
                        </p>
                      </div>

                      {/* IAIA Identity Alert (v12.6.2) */}
                      {(selectedChat?.badge === "IAIA" ||
                        selectedChat?.badge === "SYSTEM") && (
                        <div className="mb-8 p-6 rounded-[32px] bg-indigo-500/5 border border-indigo-500/10 animate-in slide-in-from-top-4">
                          <div className="flex items-start gap-4">
                            <div className="p-3 bg-indigo-600 rounded-2xl text-white shadow-lg shadow-indigo-600/20">
                              <Icon name="Shield" size={20} />
                            </div>
                            <div>
                              <h4
                                className={`text-sm font-bold ${textMain} mb-1`}
                              >
                                Protocol Rhizome Activat
                              </h4>
                              <p
                                className={`text-xs leading-relaxed ${textMuted}`}
                              >
                                Estàs bategant amb una **IAIA de Poble**.
                                Aquesta intel·ligència està sincronitzada amb el
                                llegat local i el Protocol de Restauració
                                Suprema (v12.6.2). Tots els missatges estan
                                orquestrats per al bé del Mas.
                              </p>
                            </div>
                          </div>
                        </div>
                      )}

                      <div className="self-center bg-indigo-500/10 text-indigo-400 px-6 py-1.5 rounded-full text-[9px] font-bold tracking-[0.2em] uppercase border border-indigo-500/10 mb-8 whitespace-nowrap">
                        Avui, {new Date().toLocaleDateString()}
                      </div>

                      {/* Mock Initial Message */}
                      <div className="flex gap-4 max-w-[85%]">
                        <div className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-sm shrink-0 shadow-lg border border-white/5">
                          {selectedChat?.avatar}
                        </div>
                        <div
                          className={`p-5 rounded-[32px] rounded-tl-none ${
                            isDark
                              ? "bg-[#1A1A1A] border-slate-800"
                              : "bg-white border-slate-100"
                          } border shadow-sm relative group`}
                        >
                          <p className={`text-sm leading-relaxed ${textMain}`}>
                            {selectedChat?.msg}
                          </p>
                          <div className="flex items-center justify-end gap-2 mt-3 opacity-40 group-hover:opacity-100 transition-opacity">
                            <span className="text-[9px] font-mono uppercase">
                              Lliurat
                            </span>
                            <p className="text-[9px]">
                              {selectedChat?.time.includes("p. m.") ||
                              selectedChat?.time.includes("a. m.")
                                ? selectedChat?.time.split(" ")[0]
                                : "10:00"}
                            </p>
                          </div>
                        </div>
                      </div>

                      {/* Sent/Received Messages Loop */}
                      {(sentMessages[selectedChat.id] || []).map((m, idx) => (
                        <div
                          key={idx}
                          className={`flex flex-col ${
                            m.sender === "me" ? "items-end" : "items-start"
                          } gap-2`}
                        >
                          <div
                            className={`flex gap-4 max-w-[85%] ${
                              m.sender === "me"
                                ? "flex-row-reverse"
                                : "flex-row"
                            }`}
                          >
                            {m.sender === "agent" && (
                              <div className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-sm shrink-0 shadow-lg border border-white/5">
                                {selectedChat?.avatar}
                              </div>
                            )}
                            <div
                              className={`p-5 rounded-[32px] ${
                                m.sender === "me"
                                  ? "rounded-tr-none bg-indigo-600 text-white shadow-lg shadow-indigo-600/20"
                                  : `${
                                      isDark
                                        ? "bg-[#1A1A1A] border-slate-800"
                                        : "bg-white border-slate-100"
                                    } border shadow-sm rounded-tl-none`
                              } animate-in slide-in-from-bottom-2`}
                            >
                              <p
                                className={`text-sm leading-relaxed ${
                                  m.sender === "me" ? "text-white" : textMain
                                }`}
                              >
                                {m.text}
                              </p>
                              <div
                                className={`flex items-center gap-2 mt-2 ${
                                  m.sender === "me"
                                    ? "justify-end opacity-60"
                                    : "opacity-40"
                                }`}
                              >
                                <span className="text-[9px] font-mono uppercase">
                                  {m.sender === "me" ? "Enviat" : "Rebut"}
                                </span>
                                <p className="text-[9px]">{m.time}</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}

                      {/* Typing Indicator */}
                      {isTyping === selectedChat.id && (
                        <div className="flex gap-4 max-w-[85%] animate-pulse">
                          <div className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-sm shrink-0 shadow-lg border border-white/5">
                            {selectedChat?.avatar}
                          </div>
                          <div
                            className={`p-4 rounded-[32px] rounded-tl-none ${
                              isDark
                                ? "bg-[#1A1A1A] border-slate-800"
                                : "bg-white border-slate-100"
                            } border shadow-sm`}
                          >
                            <div className="flex gap-1">
                              <div
                                className="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce"
                                style={{ animationDelay: "0ms" }}
                              ></div>
                              <div
                                className="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce"
                                style={{ animationDelay: "150ms" }}
                              ></div>
                              <div
                                className="w-1.5 h-1.5 bg-slate-500 rounded-full animate-bounce"
                                style={{ animationDelay: "300ms" }}
                              ></div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    <div
                      className={`p-4 border-t ${borderCol} ${bgApp} pb-8 lg:pb-4`}
                    >
                      <div
                        className={`flex items-center gap-2 p-1.5 rounded-[32px] ${
                          isDark ? "bg-slate-900/50" : "bg-slate-100"
                        } border ${borderCol} shadow-inner`}
                      >
                        <button className="p-3 text-slate-400 hover:text-white hover:bg-indigo-600 rounded-full transition-all group active:scale-90">
                          <Icon
                            name="Plus"
                            className="group-hover:rotate-90 transition-transform"
                          />
                        </button>
                        <input
                          type="text"
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          onKeyDown={handleKeyDown}
                          placeholder="Escriu un missatge..."
                          className={`flex-1 bg-transparent border-none outline-none text-sm px-2 ${textMain} placeholder-slate-600`}
                          autoFocus
                        />
                        <div className="flex items-center gap-0.5 pr-1">
                          <button className="p-2.5 text-slate-500 hover:text-indigo-400 transition-colors">
                            <Icon name="Mic" size={18} />
                          </button>
                          <button className="p-2.5 text-slate-500 hover:text-red-400 transition-colors">
                            <Icon name="Play" size={18} />
                          </button>
                          <button className="p-2.5 text-slate-500 hover:text-emerald-400 transition-colors">
                            <Icon name="Save" size={18} />
                          </button>
                          <button
                            onClick={handleSendMessage}
                            className="w-11 h-11 bg-indigo-600 text-white rounded-[20px] flex items-center justify-center shadow-lg shadow-indigo-600/30 active:scale-95 hover:bg-indigo-700 transition-all ml-1.5"
                          >
                            <Icon name="Send" size={18} />
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>
          </div>
        );
      };

    <!-- Modern App Entry -->
    <script type="module" src="/src/entry.jsx"></script>
    
    <script>
      /* Legacy Script Disabled
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
      */
    </script>
  </body>
</html>
