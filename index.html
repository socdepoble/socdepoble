    <script>
      // [BATEGAT RESCUE] Si hi ha un error de càrrega d'assets crítics, forcem neteja i reload.
      window.addEventListener(
        "error",
        function (e) {
          if (e.target.tagName === "LINK" || e.target.tagName === "SCRIPT") {
            console.error(
              "[PURGA] Error de càrrega d'asset:",
              e.target.src || e.target.href,
            );
            if (!window.__RELOADING__) {
              window.__RELOADING__ = true;
              setTimeout(() => {
                window.location.reload(true);
              }, 1000);
            }
          }
        },
        true,
      );
    </script>

    <script>
      // --- MASTER NOISE REDUCTION PROTOCOL (v10.26.0-CANÒNIC) ---
      // Silence library warnings and ghost extension errors for a pristine console.
      (function () {
        const silencePatterns = [
          "tailwind",
          "Babel",
          "production",
          "shadow host",
          "VM",
          "extension",
        ];

        const shouldSilence = (args) => {
          const msg = String(args[0] || "");
          return silencePatterns.some((pattern) => msg.includes(pattern));
        };

        const _warn = console.warn;
        console.warn = function (...args) {
          if (shouldSilence(args)) return;
          _warn.apply(console, args);
        };

        const _error = console.error;
        console.error = function (...args) {
          if (shouldSilence(args)) return;
          _error.apply(console, args);
        };

        window.addEventListener("unhandledrejection", (event) => {
          if (shouldSilence([event.reason?.message])) {
            event.preventDefault();
          }
        });
      })();
    </script>

      .animate-in {
