      (function () {

        window.__CURRENT_ACTIVE_APP_HASH__ = EXPECTED_HASH;

        window.addEventListener(
          "error",
          function (e) {
            if (e.target.tagName === "LINK" || e.target.tagName === "SCRIPT") {

                window.location.reload(true);
              }
            }
          },
          true,
        );
      })();

    <!-- [PWA GHOST LOCK] Pre-Boot Failsafe -->
    <script>
      (async function() {
        const APP_CODE_VERSION = 14;
        function getIDBVersion() {
          return new Promise((resolve) => {
            try {
              const req = indexedDB.open('rhizome-v1');
              req.onupgradeneeded = (e) => {
                // If it doesn't exist, we don't have a newer version
                e.target.transaction.abort();
                resolve(0);
              };
              req.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('keyval')) {
                  resolve(0);
                  return;
                }
                const tx = db.transaction('keyval', 'readonly');
                const store = tx.objectStore('keyval');
                const getReq = store.get('_sdp_schema_version');
                getReq.onsuccess = () => resolve(getReq.result || 0);
                getReq.onerror = () => resolve(0);
              };
              req.onerror = () => resolve(0);
            } catch { resolve(0); }
          });
        }
        
        try {
          const idbVersion = await getIDBVersion();
          if (idbVersion > APP_CODE_VERSION) {
            // ⚠️ PWA GHOST DETECTADO. Cortafuegos activado.
            document.body.innerHTML = `
              <div style="background: var(--blau-socdepoble, #06b6d4); color: var(--taronja-socdepoble, #ea580c); font-size: 28px; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 28px; line-height: 1.4; font-family: 'Noto Sans', sans-serif;">
                El Mas Digital s'ha reformat.<br><span style="font-size: 22px; color: white;">Netejant la memòria...</span>
              </div>`;
            
            // Purga atómica: Obligamos al SW a matarse
            if ('serviceWorker' in navigator) {
              const regs = await navigator.serviceWorker.getRegistrations();
              regs.forEach(reg => {
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              });
            }
            
            // Recarga implacable saltándose la caché tras 1.5s
            setTimeout(() => window.location.reload(true), 1500);
            throw new Error("[TRELLAT] Boot abortat per prevenir corrupció d'UI fantasma.");
          }
        } catch (e) {
          if (e.message.includes("[TRELLAT]")) throw e;
        }
      })();
    </script>
