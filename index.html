<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sóc de Poble - v1.25.0-MASTER-GOLDEN</title>

    <script>
      // --- MASTER NOISE REDUCTION PROTOCOL (v1.25.0-MASTER-GOLDEN) ---
      // Silence library warnings for a pristine Golden Master console.
      const _warn = console.warn;
      console.warn = function (...args) {
        if (
          typeof args[0] === "string" &&
          (args[0].includes("tailwind") ||
            args[0].includes("Babel") ||
            args[0].includes("production"))
        )
          return;
        _warn.apply(console, args);
      };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      /* Antigravity Scroll */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(156, 163, 175, 0.3) transparent;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.3);
        border-radius: 99px;
      }

      .custom-scrollbar {
        -ms-overflow-style: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .animate-in {
        animation: fadeIn 0.4s ease-out;
      }
      .animate-up {
        animation: slideUp 0.4s ease-out;
      }
      .zoom-in {
        animation: zoomIn 0.4s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes zoomIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .blueprint-grid {
        background-image: linear-gradient(
            to right,
            rgba(6, 182, 212, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(6, 182, 212, 0.1) 1px,
            transparent 1px
          );
        background-size: 20px 20px;
      }

      /* Ruler Overlay */
      .forense-active * {
        outline: 1px solid rgba(249, 115, 22, 0.1) !important;
      }
    </style>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              orange: { 500: "#F97316", 600: "#EA580C" },
              indigo: { 600: "#4F46E5" },
              emerald: { 600: "#059669" },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>


    <!-- Modern App Entry -->
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
