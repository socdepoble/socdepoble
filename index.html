<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-white.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>
      Sóc de Poble - La teua app de territori | v10.25.0-BATEGAT-GOLDEN
    </title>
    <meta
      name="description"
      content="L'aplicació oficial per a connectar amb el teu poble. Mercat, mapa, i sobirania digital per a la comunitat valenciana."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soc-de-poble.vercel.app/" />
    <meta
      property="og:title"
      content="Sóc de Poble - La teua app de territori"
    />
    <meta
      property="og:description"
      content="Connecta amb la teua comunitat. Mercat rural, mapa d'actius i sobirania digital."
    />
    <meta
      property="og:image"
      content="https://soc-de-poble.vercel.app/logo-white.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://soc-de-poble.vercel.app/" />
    <meta
      property="twitter:title"
      content="Sóc de Poble - La teua app de territori"
    />
    <meta
      property="twitter:description"
      content="Connecta amb la teua comunitat. Mercat rural, mapa d'actius i sobirania digital."
    />
    <meta
      property="twitter:image"
      content="https://soc-de-poble.vercel.app/logo-white.png"
    />

    <script>
      // --- MASTER NOISE REDUCTION PROTOCOL (v10.25.0-BATEGAT-GOLDEN) ---
      // Silence library warnings for a pristine Golden Master console.
      const _warn = console.warn;
      console.warn = function (...args) {
        if (
          typeof args[0] === "string" &&
          (args[0].includes("tailwind") ||
            args[0].includes("Babel") ||
            args[0].includes("production"))
        )
          return;
        _warn.apply(console, args);
      };

      // --- SHADOW HOST SILENCER ---
      // Silences the ghost error "Failed to find shadow host" from extensions.
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && event.reason.message && event.reason.message.includes("shadow host")) {
          event.preventDefault();
        }
      });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      .animate-in {
        animation: fadeIn 0.4s ease-out;
      }
      .animate-up {
        animation: slideUp 0.4s ease-out;
      }
      .zoom-in {
        animation: zoomIn 0.4s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes zoomIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .blueprint-grid {
        background-image: linear-gradient(
            to right,
            rgba(6, 182, 212, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(6, 182, 212, 0.1) 1px,
            transparent 1px
          );
        background-size: 20px 20px;
      }

      /* Ruler Overlay */
      .forense-active * {
        outline: 1px solid rgba(249, 115, 22, 0.1) !important;
      }
    </style>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              orange: { 500: "#F97316", 600: "#EA580C" },
              indigo: { 600: "#4F46E5" },
              emerald: { 600: "#059669" },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <!-- Hidden H1 for SEO -->
    <h1
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      "
    >
      Sóc de Poble - La teua xarxa de territori i sobirania digital
    </h1>
    <div id="root"></div>

    <!-- Modern App Entry -->
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
