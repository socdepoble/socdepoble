<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestoria de Poble (Jarvis Torruà)</title>
  <style>
    :root {
      /* Design Tokens de Pedra Seca Injectats */
      --sp-black-100: #0a0a0a;
      --sp-black-90: #1a1a1a;
      --sp-white-100: #F9F9F9;
      --sp-white-90: #F0F0F0;
      --sp-orange-100: #FF7300;
      --sp-blue-100: #4A47E5; /* Blau Corporatiu (Complementari Taronja) */
      --sp-red-100: #B3261E;
      --sp-green-100: #146C2E;
      --sp-border: #222222;
      --sp-radius-main: 28px;
      --sp-touch-min: 48px;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background-color: var(--sp-white-100);
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA SUPERIOR GLOBAL SÓC DE POBLE */
    .sp-top-bar {
      height: 64px;
      background-color: var(--sp-black-100);
      border-bottom: 1px solid var(--sp-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 100;
      color: white;
    }

    .sp-logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -0.5px;
      font-family: serif; /* Simulació del logotip antic */
      font-style: italic;
    }

    .sp-top-icons {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 18px;
    }

    .sp-icon-taronja {
      color: var(--sp-orange-100);
    }

    /* CONTENIDOR PRINCIPAL (Sota la barra) */
    .sp-app-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    /* Llanda de Comandament (Sidebar) */
    .sp-app-shell-sidebar {
      width: 260px;
      background-color: var(--sp-black-100);
      color: var(--sp-white-100);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--sp-border);
      flex-shrink: 0;
    }

    /* Botó Mòdul (Substitueix el + CONNECTAR lila) */
    .sp-module-btn {
      height: 56px;
      background-color: var(--sp-blue-100);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .sp-module-btn:hover {
      opacity: 0.9;
    }
    
    .sp-sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 24px;
    }
    
    .sp-nav-item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
      cursor: pointer;
    }
    
    .sp-nav-item:hover:not(.active) {
      background-color: var(--sp-black-90);
    }
    
    .sp-nav-item.active {
      background-color: var(--sp-orange-100);
      color: var(--sp-black-100);
    }

    .sp-nav-item.active .sp-nav-icon {
      /* Ajust visual per a l'actiu */
    }
    
    .sp-nav-icon {
      width: 24px;
      height: 24px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .sp-sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--sp-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .sp-profile-avatar {
      width: 40px;
      height: 40px;
      background-color: var(--sp-orange-100);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--sp-black-100);
    }
    
    .sp-profile-info {
      display: flex;
      flex-direction: column;
    }
    
    .sp-profile-name {
      font-size: 14px;
      font-weight: 600;
    }
    
    .sp-profile-role {
      font-size: 12px;
      color: #999;
    }
    
    /* Àrea de Contingut (Main) */
    .sp-app-shell-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background-color: var(--sp-white-90);
    }
    
    /* Web Component Wrapper */
    /* NAV MOBIL */
    .sp-app-shell-nav-mobil {
      display: none;
    }

    @media (max-width: 768px) {
      .sp-app-shell-sidebar {
        display: none !important;
      }
      .sp-app-shell-nav-mobil {
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: var(--sp-black-100);
        height: 64px;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        border-top: 1px solid var(--sp-border);
      }
      .sp-app-shell-nav-mobil .sp-nav-item {
        flex: 1;
        justify-content: center;
        padding: 0;
        height: 100%;
        color: white;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sp-app-shell-nav-mobil .sp-nav-item.active {
        color: var(--sp-orange-100);
        background-color: transparent;
      }
      .sp-app-shell-nav-mobil .sp-nav-icon {
        margin-right: 0;
      }
      .sp-app-shell-nav-mobil .sp-nav-item-center {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
      }
      .sp-nav-mobil-btn-add {
        background-color: var(--sp-purple-100);
        color: white;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .sp-nav-mobil-btn-add:active {
        transform: scale(0.95);
      }
      .sp-top-bar {
        padding: 0 16px;
      }
      .sp-top-icons {
        gap: 0;
      }
      .sp-top-icons span {
        padding: 0 4px;
      }
      .sp-top-icons span:last-child {
        padding-right: 0;
      }
      .sp-app-shell-main {
        padding-bottom: 64px;
      }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./tauler.js"></script>
</head>
<body>

    </div>
  </header>

  <div class="sp-app-container">
    <nav class="sp-app-shell-sidebar">
      
      <!-- EL BOTÓ BLAU QUE ACTUA DE "TORNAR" / IDENTIFICADOR DE MÒDUL -->
      <div class="sp-module-btn" style="cursor: pointer;" onclick="window.location.href='http://localhost:3333/hub'">
        <span style="margin-right: 8px; display: flex;"><i data-lucide="building-2"></i></span>
        GESTORIA DE POBLE
      </div>
      
      <div class="sp-sidebar-nav">
        <a class="sp-nav-item active" data-view="home">
          <span class="sp-nav-icon"><i data-lucide="layout-dashboard"></i></span>
          Tauler d'Inici
        </a>
        <a class="sp-nav-item" data-view="factures">
          <span class="sp-nav-icon"><i data-lucide="file-text"></i></span>
          Factures
        </a>
        <a class="sp-nav-item" data-view="compres">
          <span class="sp-nav-icon"><i data-lucide="shopping-cart"></i></span>
          Compres
        </a>
        <a class="sp-nav-item" data-view="bancs">
          <span class="sp-nav-icon"><i data-lucide="landmark"></i></span>
          Bancs
        </a>
        <a class="sp-nav-item" data-view="impostos">
          <span class="sp-nav-icon"><i data-lucide="calculator"></i></span>
          Impostos
        </a>
        <a class="sp-nav-item" data-view="informes">
          <span class="sp-nav-icon"><i data-lucide="pie-chart"></i></span>
          Informes
        </a>
        <a class="sp-nav-item" data-view="ingesta">
          <span class="sp-nav-icon"><i data-lucide="scan"></i></span>
          Escàner Local
        </a>

    <main class="sp-app-shell-main">
      <!-- Web Component Aïllat (El Motor) -->
    <gestoria-tauler vista="hisenda"></gestoria-tauler>
    </main>
  </div>
  
  <script>
    // Lògica bàsica de navegació del menú a index.html
    document.addEventListener('DOMContentLoaded', () => {
      const navItems = document.querySelectorAll('.sp-nav-item');
      const tauler = document.querySelector('gestoria-tauler');
      
      navItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const viewName = e.currentTarget.dataset.view;
          if (!viewName) return;

          // Sincronitza l'estat actiu entre escriptori i mòbil
          navItems.forEach(nav => {
            if (nav.dataset.view === viewName) {
              nav.classList.add('active');
            } else {
              nav.classList.remove('active');
            }
          });
          
          // Passar l'ordre de canvi de vista al Web Component
          if (tauler && tauler.canviarVista) {
            tauler.canviarVista(viewName);
          }
        });
      });
      
      // Inicialitza les icones SVG
      if (window.lucide) {
        console.log("Lucide està carregat", window.lucide);
        lucide.createIcons();
      } else {
        console.error("Lucide NO s'ha carregat correctament.");
      }
    });
  </script>

  <!-- NAV MOBIL (Substitueix la Sidebar en < 768px) -->
  <nav class="sp-app-shell-nav-mobil">
    <a class="sp-nav-item" data-view="xat" href="/xat">
      <span class="sp-nav-icon"><i data-lucide="message-square"></i></span>
    </a>
    <a class="sp-nav-item active" data-view="home" href="/soc_de_poble/index.html">
      <span class="sp-nav-icon"><i data-lucide="layout-grid"></i></span>

      <div class="sp-nav-mobil-btn-add">

      </div>
    </a>

    <a class="sp-nav-item" data-view="pobles" href="#">
