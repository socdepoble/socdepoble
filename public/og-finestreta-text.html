<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      box-sizing: border-box;
      border-bottom: 20px solid #ff6b00;
    }
    .badge {
      background-color: #ff6b00;
      color: #ffffff;
      padding: 10px 30px;
      border-radius: 50px;
      font-size: 28px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }
    .title {
      font-size: 110px;
      font-weight: 900;
      line-height: 1.1;
      margin: 0 0 30px 0;
      letter-spacing: -2px;
      text-transform: uppercase;
    }
    .highlight {
      color: #ff6b00;
    }
    .subtitle {
      font-size: 42px;
      font-weight: 500;
      color: #a0a0a0;
      margin: 0;
    }
    .footer {
      position: absolute;
      bottom: 50px;
      font-size: 28px;
      color: #666;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="badge">Burocràcia Fàcil</div>
  <h1 class="title">FIRMA CONTRA EL <br><span class="highlight">MEV DE PLANES</span></h1>
  <p class="subtitle">Adhereix-te a l'al·legació col·lectiva</p>
  <div class="footer">Sóc de Poble</div>
</body>
</html>
