<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sóc de Poble - Mode Bancal</title>
    <link rel="stylesheet" href="static/css/nano_banana.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: #050505;
            /* Black OLED [Source 65] */
            color: #E6E1E5;
            /* M3 On-Surface */
            padding: 20px;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .offline-card {
            border: 1px solid var(--color-terracotta, #9A6C63);
            background: rgba(20, 20, 20, 0.8);
            padding: 40px;
            border-radius: 28px;
            /* M3 Extra Large [Source 64] */
            max-width: 400px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .iaia-avatar {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            color: var(--color-terracotta, #9A6C63);
            font-family: 'DM Sans', sans-serif;
            margin-bottom: 16px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #E3E3E3;
            margin-bottom: 32px;
            line-height: 1.6;
            font-size: 16px;
        }

        .btn-home {
            background-color: var(--color-olivera, #556B2F);
            /* Verd Serra [Source 168] */
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 999px;
            font-weight: bold;
            display: inline-block;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn-home:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }
    </style>
</head>

<body>
    <div class="offline-card">
        <span class="iaia-avatar">👵🚜</span>
        <h1>Estàs al Tros</h1>
        <p>Sembla que la cobertura s'ha quedat al poble. No patisques, pots seguir consultant el que tens al rebost o
            escriure notes noves.</p>
        <a href="./index.html" class="btn-home">Tornar a la Masia</a>
    </div>
</body>

</html>
