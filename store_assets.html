<!DOCTYPE html>
<html lang="va">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sóc de Poble | Generador d'Assets ASO 🏺📱</title>
    <style>
        :root {
            --color-terracotta: #FF6D23;
            --color-cyan: #00F2FF;
            --font-display: 'Inter', 'Outfit', sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-display);
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .controls {
            margin-bottom: 40px;
            display: flex;
            gap: 20px;
            background: #000;
            padding: 20px;
            border: 2px solid var(--color-terracotta);
            box-shadow: 4px 4px 0px #000;
        }

        button {
            padding: 10px 20px;
            background: var(--color-terracotta);
            border: none;
            color: black;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        .banner-container {
            width: 1242px;
            height: 2208px;
            /* Proporció App Store 5.5" */
            background: linear-gradient(135deg, #FF6D23 0%, #FF8D53 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 100px 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            transform: scale(0.3);
            transform-origin: top center;
        }

        .banner-text {
            font-size: 120px;
            font-weight: 900;
            text-align: center;
            color: white;
            text-shadow: 8px 8px 0px #000;
            width: 80%;
            z-index: 2;
        }

        .phone-frame {
            width: 800px;
            height: 1600px;
            background: #000;
            border: 20px solid #333;
            border-radius: 60px;
            box-shadow: 20px 20px 0px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            margin-top: 50px;
        }

        .app-screenshot {
            width: 100%;
            height: 100%;
            background: #000;
            background-size: cover;
            border-radius: 40px;
            overflow: hidden;
        }

        .logo-watermark {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 150px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="controls">
        <button onclick="updateText('BATEGA SENSE WIFI')">Batega Sense Wifi</button>
        <button onclick="updateText('EL TEU POBLE, LA TEUA VEU')">Sobirania</button>
        <button onclick="updateText('MERCAT Km 0')">Mercat</button>
    </div>

    <div id="banner" class="banner-container">
        <div id="text" class="banner-text">BATEGA SENSE WIFI</div>
        <div class="phone-frame">
            <div class="app-screenshot" style="background-image: url('https://socdepoble.org/og-image.png')">
            </div>
        </div>
        <img class="logo-watermark" src="https://socdepoble.org/favicon.png" alt="Logo">
    </div>

    <script>
        function updateText(newText) {
            document.getElementById('text').innerText = newText;
        }
    </script>
</body>

</html>
